# Transur — full stack (MySQL + API + web app).
#   cp .env.example .env   # then fill in the secrets
#   docker compose up -d --build
# Add the reverse proxy with:  docker compose --profile proxy up -d

name: transur

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-transur}
      MYSQL_USER: ${DB_USER:-transur}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_URL: ${APP_URL:-http://localhost:3000}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-transur}
      DB_USER: ${DB_USER:-transur}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_USERNAME: ${SMS_USERNAME:-sandbox}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-TRANSUR}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      DEFAULT_CITY: ${DEFAULT_CITY:-lubumbashi}
      WALLET_DEBT_LIMIT: ${WALLET_DEBT_LIMIT:--5.00}
    volumes:
      - uploads:/srv/api/uploads
    ports:
      - "5000:5000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:5000}
        NEXT_PUBLIC_CURRENCY: ${CURRENCY:-CDF}
        NEXT_PUBLIC_CURRENCY_RATE: ${CURRENCY_RATE:-2800}
        NEXT_PUBLIC_MAP_CENTER: ${MAP_CENTER:--11.6609,27.4794}
        NEXT_PUBLIC_PRICE_STEP: ${PRICE_STEP:-500}
        NEXT_PUBLIC_SEARCH_COUNTRY: ${SEARCH_COUNTRY:-cd}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  proxy:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/acme:/var/www/acme:ro

volumes:
  db-data:
  uploads:
