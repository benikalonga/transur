upstream transur_api {
    server backend:5000;
    keepalive 32;
}

upstream transur_web {
    server frontend:3000;
    keepalive 16;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name transur.bndnow.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name transur.bndnow.com;

    # SSL (généré par Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/transur.bndnow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transur.bndnow.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Gzip — crucial pour faible connexion
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    client_max_body_size 10M;

    # ── API REST ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://transur_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket (Socket.io) ────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://transur_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Uploads statiques ───────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://transur_api;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Frontend Next.js ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://transur_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Assets statiques Next.js ────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://transur_web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sécurité
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
